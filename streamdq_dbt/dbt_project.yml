# dbt project for StreamDQ violation analysis and metrics
name: 'streamdq_dbt'
version: '1.0.0'
config-version: 2

vars:
  streamdq_schema: streamdq
  violation_retention_days: 90

seeds:
  streamdq_violation_types:
    +schema: "{{ var('streamdq_schema') }}"
   violation_types:
      - id: SYNTACTIC
        description: Single-record type/schema validation
      - id: SEMANTIC
        description: Single-record domain/contextual validation
      - id: CROSS_RECORD
        description: Multi-record validation

models:
  streamdq_violations:
    +schema: "{{ var('streamdq_schema') }}"
    +materialized: table
  streamdq_metrics:
    +schema: "{{ var('streamdq_schema') }}"
    +materialized: table

on-run-start:
  - "{{ grant_usage('streamdq') }}"
