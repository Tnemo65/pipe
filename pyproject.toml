[project]
name = "streamdq"
version = "0.1.0"
description = "A Context-Aware Framework for Streaming Data Quality Monitoring"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4.0",
    "pyspark>=3.5.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "kafka-python>=2.0.2",
    "requests>=2.31.0",
    "gtfs-realtime-bindings>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "prometheus-client>=0.19.0",
    "click>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
